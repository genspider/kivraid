{{define "content"}}
<div class="mx-auto flex max-w-md flex-col items-center gap-4 py-16 text-center">
  <span class="inline-flex size-12 items-center justify-center rounded-full bg-danger-soft text-danger">
    {{icon "lock" "size-6"}}
  </span>
  <div>
    <h1 class="page-heading">{{t "No access to %s" .Data.Name}}</h1>
    <p class="mt-2 text-sm text-muted">{{t "Your account is not in any of the groups allowed to use this application. If you believe this is a mistake, contact your administrator."}}</p>
  </div>
  <a href="/" class="btn-primary mt-2">{{t "Back to home"}}</a>
</div>
{{end}}
